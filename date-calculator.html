<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Date Calculator – Add or Subtract Days</title>
  <link rel="stylesheet" href="date-calculator.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <span class="logo">&#128197; Date Calculator</span>
      <nav>
        <a href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Date Calculator</h1>
    <p class="subtitle">Add to or subtract from a date</p>

    <div class="card">
      <!-- ── Start Date ── -->
      <section class="section">
        <h2>Start Date</h2>
        <div class="field-row">
          <label for="startDate">Date</label>
          <input type="date" id="startDate" />
          <button class="btn-secondary" id="todayBtn">Today</button>
        </div>
      </section>

      <!-- ── Operation ── -->
      <section class="section">
        <h2>Operation</h2>
        <div class="toggle-group" role="radiogroup" aria-label="Operation">
          <label class="toggle-option">
            <input type="radio" name="operation" value="add" checked />
            <span>Add</span>
          </label>
          <label class="toggle-option">
            <input type="radio" name="operation" value="subtract" />
            <span>Subtract</span>
          </label>
        </div>
      </section>

      <!-- ── Duration ── -->
      <section class="section">
        <h2>Duration</h2>
        <div class="duration-grid">
          <div class="duration-field">
            <label for="years">Years</label>
            <input type="number" id="years" min="0" value="0" />
          </div>
          <div class="duration-field">
            <label for="months">Months</label>
            <input type="number" id="months" min="0" value="0" />
          </div>
          <div class="duration-field">
            <label for="weeks">Weeks</label>
            <input type="number" id="weeks" min="0" value="0" />
          </div>
          <div class="duration-field">
            <label for="days">Days</label>
            <input type="number" id="days" min="0" value="0" />
          </div>
        </div>
      </section>

      <!-- ── Calculate Button ── -->
      <div class="actions">
        <button class="btn-primary" id="calculateBtn">Calculate</button>
        <button class="btn-ghost" id="resetBtn">Reset</button>
      </div>
    </div>

    <!-- ── Result ── -->
    <div class="result-card" id="resultCard" hidden>
      <div class="result-header">Result</div>
      <div class="result-date" id="resultDate"></div>
      <div class="result-weekday" id="resultWeekday"></div>

      <table class="breakdown-table" id="breakdownTable">
        <thead>
          <tr>
            <th>Component</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody id="breakdownBody"></tbody>
      </table>

      <div class="total-days-row">
        <span>Total days <span id="opWord">added</span>:</span>
        <strong id="totalDays"></strong>
      </div>
    </div>

    <!-- ── Quick Shortcuts ── -->
    <div class="shortcuts-card">
      <h3>Quick Add</h3>
      <div class="shortcut-buttons">
        <button class="shortcut-btn" data-days="7">+7 days</button>
        <button class="shortcut-btn" data-days="14">+14 days</button>
        <button class="shortcut-btn" data-days="30">+30 days</button>
        <button class="shortcut-btn" data-days="90">+90 days</button>
        <button class="shortcut-btn" data-days="180">+180 days</button>
        <button class="shortcut-btn" data-days="365">+1 year</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="footerYear"></span> Date Calculator</p>
  </footer>

  <script src="date-calculator.js"></script>
</body>
</html>
